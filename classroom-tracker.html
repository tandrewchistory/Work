<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Tracker</title>
<style>
:root {
  --bg: #f7f7fb;
  --panel: #ffffff;
  --border: #e0e0e8;
  --text: #1f2430;
  --muted: #6b7280;
  --accent: #3b5bdb;
  --accent-hover: #2f4bb0;
  --danger: #d64545;
  --present: #2f9e44;
  --absent: #d64545;
  --tardy: #e08e0b;
  --excused: #6b7280;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); }
header { display: flex; align-items: center; gap: 24px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; }
nav { display: flex; gap: 4px; }
nav a, .tab-btn { padding: 8px 14px; border-radius: 6px; text-decoration: none; color: var(--muted); font-size: 14px; cursor: pointer; border: none; background: none; }
nav a.active, nav a:hover, .tab-btn.active, .tab-btn:hover { background: #eef1fd; color: var(--accent); }
.header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.header-actions button { font-size: 13px; padding: 6px 10px; }
main { max-width: 980px; margin: 0 auto; padding: 24px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; overflow-x: auto; }
h2 { margin-top: 0; font-size: 17px; }
h3 { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
input, select, textarea { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: #fff; color: var(--text); }
textarea { width: 100%; min-height: 60px; font-family: inherit; }
button { padding: 8px 14px; border-radius: 6px; border: 1px solid transparent; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }
button:hover { background: var(--accent-hover); }
button.secondary { background: #fff; border: 1px solid var(--border); color: var(--text); }
button.secondary:hover { background: #f1f2f6; }
button.danger { background: var(--danger); }
button.danger:hover { background: #b83a3a; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
th { white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
tr.clickable { cursor: pointer; }
tr.clickable:hover { background: #f9f9fd; }
.status-btns { display: flex; gap: 4px; }
.status-btns button { padding: 4px 8px; font-size: 12px; background: #fff; color: var(--text); border: 1px solid var(--border); }
.status-btns button.selected.present { background: var(--present); color: #fff; border-color: var(--present); }
.status-btns button.selected.absent { background: var(--absent); color: #fff; border-color: var(--absent); }
.status-btns button.selected.tardy { background: var(--tardy); color: #fff; border-color: var(--tardy); }
.status-btns button.selected.excused { background: var(--excused); color: #fff; border-color: var(--excused); }
.muted { color: var(--muted); font-size: 13px; }
.error { color: var(--danger); font-size: 13px; margin-top: 6px; }
.notice { font-size: 13px; margin-top: 6px; color: var(--present); }
.crumbs { font-size: 13px; margin-bottom: 12px; }
.crumbs a { color: var(--accent); cursor: pointer; }
.student-link { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 500; }
.student-link:hover { text-decoration: underline; }
td.form-class { color: var(--muted); font-size: 13px; }
.profile-meta { display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 4px 0 14px; }
.profile-meta strong { color: var(--text); }
.slot-row { align-items: center; gap: 6px; }
.slot-row select { padding: 7px 8px; }
.slot-to { font-size: 12.5px; color: var(--muted); }
.slot-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 24px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: #eef1fd; color: var(--accent);
  padding: 3px 6px 3px 10px; border-radius: 999px; font-size: 12.5px;
}
.chip-remove { background: none; border: none; color: inherit; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 4px; }
.chip-remove:hover { color: var(--danger); background: none; }
.edit-actions { display: flex; gap: 8px; margin-top: 4px; }
.lesson-card { border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
.lesson-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.lesson-date { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
.lesson-card h4 { margin: 0; font-size: 15px; }
.lesson-field { margin: 10px 0 0; font-size: 13.5px; }
.lesson-field-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 3px; }
.lesson-field-text { white-space: pre-wrap; }
.panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.panel-header h2 { margin-bottom: 0; }
.class-header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.class-header-row .profile-meta { margin: 0; }
.score-input { width: 64px; }
.subtabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.subtabs button { border-radius: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); padding: 8px 4px; }
.subtabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
.subtabs button:hover { background: none; color: var(--accent); }
.banner { background: #fff8e1; border: 1px solid #f0d98c; color: #6b5900; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin: 16px 24px 0; }
#file-input { display: none; }
</style>
</head>
<body>
  <header>
    <h1>Classroom Tracker</h1>
    <nav>
      <a href="#/classes">Classes</a>
      <a href="#/students">Students</a>
    </nav>
    <div class="header-actions">
      <button class="secondary" id="export-btn" type="button">Export backup</button>
      <button class="secondary" id="import-btn" type="button">Import backup</button>
      <input type="file" id="file-input" accept="application/json">
    </div>
  </header>
  <div class="banner">
    Your data is stored only in this browser (nothing is sent anywhere). Clearing browser data will erase it —
    use <strong>Export backup</strong> regularly to save a copy you can restore with <strong>Import backup</strong>.
  </div>
  <main id="app"></main>

<script>
'use strict';

/* ============================== storage layer ============================== */

const STORAGE_KEY = 'classroom-tracker:v1';
const STATUSES = ['present', 'absent', 'tardy', 'excused'];
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

const DAYS = [
  { code: 'Mon', label: 'Monday' },
  { code: 'Tue', label: 'Tuesday' },
  { code: 'Wed', label: 'Wednesday' },
  { code: 'Thu', label: 'Thursday' },
  { code: 'Fri', label: 'Friday' },
];

// Period start times: 20-minute steps from 8:00am to 3:20pm inclusive.
const TIMES = (() => {
  const times = [];
  for (let mins = 8 * 60; mins <= 15 * 60 + 20; mins += 20) {
    times.push(`${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`);
  }
  return times;
})();

// Period end times: 20-minute steps from 8:20am to 3:40pm inclusive (one step
// past every possible start, so the last period can end at 3:40pm).
const END_TIMES = (() => {
  const times = [];
  for (let mins = 8 * 60 + 20; mins <= 15 * 60 + 40; mins += 20) {
    times.push(`${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`);
  }
  return times;
})();

function formatTime(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  const period = h < 12 ? 'am' : 'pm';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2, '0')}${period}`;
}

function addMinutes(hhmm, delta) {
  const [h, m] = hhmm.split(':').map(Number);
  const total = h * 60 + m + delta;
  return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
}

function isValidSlot(s) {
  return !!s && DAYS.some((d) => d.code === s.day) && TIMES.includes(s.time) &&
    !!s.end && END_TIMES.includes(s.end) && s.end > s.time;
}

function validSlots(value, label) {
  const list = Array.isArray(value) ? value : [];
  for (const s of list) {
    if (!isValidSlot(s)) throw new Error(`Invalid ${label} entry`);
  }
  const seen = new Set();
  const deduped = list.filter((s) => {
    const key = `${s.day}:${s.time}:${s.end}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  return deduped.sort((a, b) =>
    DAYS.findIndex((d) => d.code === a.day) - DAYS.findIndex((d) => d.code === b.day) || a.time.localeCompare(b.time)
  );
}

function formatSlots(slots) {
  if (!slots) return '';
  if (typeof slots === 'string') return slots; // data saved before the day/time picker existed
  return slots.length
    ? slots.map((s) => `${s.day} ${formatTime(s.time)}${s.end ? '–' + formatTime(s.end) : ''}`).join(', ')
    : '';
}

function emptyState() {
  return { classes: [], students: [], enrollments: [], attendance: [], assignments: [], grades: [], lessons: [] };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return emptyState();
    const parsed = JSON.parse(raw);
    return { ...emptyState(), ...parsed };
  } catch {
    return emptyState();
  }
}

let state = loadState();

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    alert('Could not save changes: browser storage may be full, disabled, or this is a private/incognito window. Export a backup and check your browser settings.');
  }
}

function nextId(collection) {
  return collection.reduce((max, item) => Math.max(max, item.id), 0) + 1;
}

function required(value, label, maxLen) {
  const v = (value || '').trim();
  if (!v) throw new Error(`${label} is required`);
  if (maxLen && v.length > maxLen) throw new Error(`${label} must be ${maxLen} characters or fewer`);
  return v;
}

function optionalText(value, maxLen) {
  const v = (value || '').trim();
  if (!v) return null;
  if (maxLen && v.length > maxLen) throw new Error(`Value must be ${maxLen} characters or fewer`);
  return v;
}

const Store = {
  /* ---- classes ---- */
  listClasses() {
    return state.classes
      .map((c) => ({ ...c, student_count: state.enrollments.filter((e) => e.class_id === c.id).length }))
      .sort((a, b) => a.name.localeCompare(b.name));
  },
  createClass({ name, subject, venue, odd_week_slots, even_week_slots }) {
    const cls = {
      id: nextId(state.classes),
      name: required(name, 'Class', 200),
      subject: optionalText(subject, 200),
      venue: optionalText(venue, 50),
      odd_week_slots: validSlots(odd_week_slots, 'odd week slot'),
      even_week_slots: validSlots(even_week_slots, 'even week slot'),
      created_at: new Date().toISOString(),
    };
    state.classes.push(cls);
    persist();
    return cls;
  },
  getClass(id) {
    const cls = state.classes.find((c) => c.id === id);
    if (!cls) return null;
    const roster = state.enrollments
      .filter((e) => e.class_id === id)
      .map((e) => {
        const s = state.students.find((s) => s.id === e.student_id);
        return { enrollment_id: e.id, student_id: s.id, full_name: s.full_name, name: s.name, form_class: s.form_class, email: s.email };
      })
      .sort((a, b) => a.full_name.localeCompare(b.full_name));
    return { ...cls, roster };
  },
  updateClass(id, { name, subject, venue, odd_week_slots, even_week_slots }) {
    const cls = state.classes.find((c) => c.id === id);
    if (!cls) throw new Error('Class not found');
    Object.assign(cls, {
      name: required(name, 'Class', 200),
      subject: optionalText(subject, 200),
      venue: optionalText(venue, 50),
      odd_week_slots: validSlots(odd_week_slots, 'odd week slot'),
      even_week_slots: validSlots(even_week_slots, 'even week slot'),
    });
    persist();
    return cls;
  },
  deleteClass(id) {
    const enrollmentIds = new Set(state.enrollments.filter((e) => e.class_id === id).map((e) => e.id));
    const assignmentIds = new Set(state.assignments.filter((a) => a.class_id === id).map((a) => a.id));
    state.attendance = state.attendance.filter((a) => !enrollmentIds.has(a.enrollment_id));
    state.grades = state.grades.filter((g) => !enrollmentIds.has(g.enrollment_id) && !assignmentIds.has(g.assignment_id));
    state.assignments = state.assignments.filter((a) => a.class_id !== id);
    state.enrollments = state.enrollments.filter((e) => e.class_id !== id);
    state.lessons = state.lessons.filter((l) => l.class_id !== id);
    state.classes = state.classes.filter((c) => c.id !== id);
    persist();
  },

  /* ---- lessons ---- */
  listLessons(classId) {
    return state.lessons
      .filter((l) => l.class_id === classId)
      .sort((a, b) => (a.date || '9999-99-99').localeCompare(b.date || '9999-99-99') || a.id - b.id);
  },
  createLesson(classId, { date, topic, objectives, resources, notes }) {
    if (!state.classes.some((c) => c.id === classId)) throw new Error('Class not found');
    if (date && !DATE_RE.test(date)) throw new Error('Date must be YYYY-MM-DD');
    const lesson = {
      id: nextId(state.lessons),
      class_id: classId,
      date: date || null,
      topic: required(topic, 'Topic', 200),
      objectives: optionalText(objectives, 2000),
      resources: optionalText(resources, 500),
      notes: optionalText(notes, 2000),
      created_at: new Date().toISOString(),
    };
    state.lessons.push(lesson);
    persist();
    return lesson;
  },
  updateLesson(id, { date, topic, objectives, resources, notes }) {
    const lesson = state.lessons.find((l) => l.id === id);
    if (!lesson) throw new Error('Lesson not found');
    if (date && !DATE_RE.test(date)) throw new Error('Date must be YYYY-MM-DD');
    Object.assign(lesson, {
      date: date || null,
      topic: required(topic, 'Topic', 200),
      objectives: optionalText(objectives, 2000),
      resources: optionalText(resources, 500),
      notes: optionalText(notes, 2000),
    });
    persist();
    return lesson;
  },
  deleteLesson(id) {
    state.lessons = state.lessons.filter((l) => l.id !== id);
    persist();
  },

  /* ---- students ---- */
  listStudents(q) {
    let list = state.students;
    if (q) {
      const needle = q.trim().toLowerCase();
      list = list.filter((s) =>
        s.full_name.toLowerCase().includes(needle) ||
        s.name.toLowerCase().includes(needle) ||
        s.form_class.toLowerCase().includes(needle) ||
        (s.email || '').toLowerCase().includes(needle)
      );
    }
    return [...list].sort((a, b) => a.full_name.localeCompare(b.full_name));
  },
  createStudent({ full_name, name, form_class, email, notes }) {
    const cleanEmail = optionalText(email, 254);
    if (cleanEmail && !EMAIL_RE.test(cleanEmail)) throw new Error('Email must be valid');
    if (cleanEmail && state.students.some((s) => (s.email || '').toLowerCase() === cleanEmail.toLowerCase())) {
      throw new Error('A student with that email already exists');
    }
    const student = {
      id: nextId(state.students),
      full_name: required(full_name, 'Full name', 200),
      name: required(name, 'Name', 100),
      form_class: required(form_class, 'Form class', 50),
      email: cleanEmail,
      notes: optionalText(notes, 2000),
      created_at: new Date().toISOString(),
    };
    state.students.push(student);
    persist();
    return student;
  },
  updateStudent(id, { full_name, name, form_class, email, notes }) {
    const student = state.students.find((s) => s.id === id);
    if (!student) throw new Error('Student not found');
    const cleanEmail = optionalText(email, 254);
    if (cleanEmail && !EMAIL_RE.test(cleanEmail)) throw new Error('Email must be valid');
    if (cleanEmail && state.students.some((s) => s.id !== id && (s.email || '').toLowerCase() === cleanEmail.toLowerCase())) {
      throw new Error('A student with that email already exists');
    }
    Object.assign(student, {
      full_name: required(full_name, 'Full name', 200),
      name: required(name, 'Name', 100),
      form_class: required(form_class, 'Form class', 50),
      email: cleanEmail,
      notes: optionalText(notes, 2000),
    });
    persist();
    return student;
  },
  getStudent(id) {
    const student = state.students.find((s) => s.id === id);
    if (!student) return null;
    const classes = state.enrollments
      .filter((e) => e.student_id === id)
      .map((e) => {
        const c = state.classes.find((c) => c.id === e.class_id);
        return { id: c.id, name: c.name, subject: c.subject, venue: c.venue, enrollment_id: e.id };
      })
      .sort((a, b) => a.name.localeCompare(b.name));
    return { ...student, classes };
  },
  deleteStudent(id) {
    const enrollmentIds = new Set(state.enrollments.filter((e) => e.student_id === id).map((e) => e.id));
    state.attendance = state.attendance.filter((a) => !enrollmentIds.has(a.enrollment_id));
    state.grades = state.grades.filter((g) => !enrollmentIds.has(g.enrollment_id));
    state.enrollments = state.enrollments.filter((e) => e.student_id !== id);
    state.students = state.students.filter((s) => s.id !== id);
    persist();
  },

  /* ---- enrollments ---- */
  enroll(classId, studentId) {
    if (!state.classes.some((c) => c.id === classId)) throw new Error('Class not found');
    if (!state.students.some((s) => s.id === studentId)) throw new Error('Student not found');
    if (state.enrollments.some((e) => e.class_id === classId && e.student_id === studentId)) {
      throw new Error('Student already enrolled in this class');
    }
    const enrollment = { id: nextId(state.enrollments), class_id: classId, student_id: studentId, created_at: new Date().toISOString() };
    state.enrollments.push(enrollment);
    persist();
    return enrollment;
  },
  unenroll(enrollmentId) {
    state.attendance = state.attendance.filter((a) => a.enrollment_id !== enrollmentId);
    state.grades = state.grades.filter((g) => g.enrollment_id !== enrollmentId);
    state.enrollments = state.enrollments.filter((e) => e.id !== enrollmentId);
    persist();
  },

  /* ---- attendance ---- */
  getAttendanceForDate(classId, date) {
    const roster = state.enrollments.filter((e) => e.class_id === classId).map((e) => {
      const s = state.students.find((s) => s.id === e.student_id);
      const rec = state.attendance.find((a) => a.enrollment_id === e.id && a.date === date);
      return { enrollment_id: e.id, student_id: s.id, name: s.name, full_name: s.full_name, status: rec ? rec.status : null, notes: rec ? rec.notes : null };
    });
    return roster.sort((a, b) => a.full_name.localeCompare(b.full_name));
  },
  saveAttendance(classId, date, records) {
    if (!DATE_RE.test(date)) throw new Error('Date must be YYYY-MM-DD');
    const validIds = new Set(state.enrollments.filter((e) => e.class_id === classId).map((e) => e.id));
    for (const r of records) {
      if (!validIds.has(r.enrollment_id)) throw new Error(`enrollment ${r.enrollment_id} is not in this class`);
      if (!STATUSES.includes(r.status)) throw new Error('Invalid status');
    }
    for (const r of records) {
      const existing = state.attendance.find((a) => a.enrollment_id === r.enrollment_id && a.date === date);
      if (existing) {
        existing.status = r.status;
        existing.notes = optionalText(r.notes, 500);
      } else {
        state.attendance.push({ id: nextId(state.attendance), enrollment_id: r.enrollment_id, date, status: r.status, notes: optionalText(r.notes, 500) });
      }
    }
    persist();
  },

  /* ---- assignments ---- */
  listAssignments(classId) {
    return state.assignments
      .filter((a) => a.class_id === classId)
      .sort((a, b) => (a.due_date || '9999').localeCompare(b.due_date || '9999') || a.id - b.id);
  },
  createAssignment(classId, { name, category, max_points, due_date }) {
    if (!state.classes.some((c) => c.id === classId)) throw new Error('Class not found');
    const points = max_points === undefined || max_points === null || max_points === '' ? 100 : Number(max_points);
    if (!(points > 0)) throw new Error('Max points must be a positive number');
    if (due_date && !DATE_RE.test(due_date)) throw new Error('Due date must be YYYY-MM-DD');
    const assignment = {
      id: nextId(state.assignments), class_id: classId,
      name: required(name, 'Name', 200), category: optionalText(category, 100),
      max_points: points, due_date: due_date || null, created_at: new Date().toISOString(),
    };
    state.assignments.push(assignment);
    persist();
    return assignment;
  },
  deleteAssignment(id) {
    state.grades = state.grades.filter((g) => g.assignment_id !== id);
    state.assignments = state.assignments.filter((a) => a.id !== id);
    persist();
  },

  /* ---- grades ---- */
  saveGrades(assignmentId, records) {
    const assignment = state.assignments.find((a) => a.id === assignmentId);
    if (!assignment) throw new Error('Assignment not found');
    const validIds = new Set(state.enrollments.filter((e) => e.class_id === assignment.class_id).map((e) => e.id));
    for (const r of records) {
      if (!validIds.has(r.enrollment_id)) throw new Error(`enrollment ${r.enrollment_id} is not in this class`);
      if (r.score !== null && r.score !== undefined && !(Number(r.score) >= 0)) throw new Error('Score must be a non-negative number');
    }
    for (const r of records) {
      const existing = state.grades.find((g) => g.assignment_id === assignmentId && g.enrollment_id === r.enrollment_id);
      const score = r.score === null || r.score === undefined || r.score === '' ? null : Number(r.score);
      if (existing) existing.score = score;
      else state.grades.push({ id: nextId(state.grades), assignment_id: assignmentId, enrollment_id: r.enrollment_id, score });
    }
    persist();
  },
  gradebook(classId) {
    const cls = state.classes.find((c) => c.id === classId);
    const students = state.enrollments.filter((e) => e.class_id === classId).map((e) => {
      const s = state.students.find((s) => s.id === e.student_id);
      return { enrollment_id: e.id, student_id: s.id, name: s.name, full_name: s.full_name };
    }).sort((a, b) => a.full_name.localeCompare(b.full_name));
    const assignments = Store.listAssignments(classId);
    const matrix = students.map((s) => ({
      ...s,
      scores: Object.fromEntries(assignments.map((a) => {
        const g = state.grades.find((g) => g.assignment_id === a.id && g.enrollment_id === s.enrollment_id);
        return [a.id, g ? g.score : null];
      })),
    }));
    return { class: cls, assignments, students: matrix };
  },
};

/* ============================== DOM helper ============================== */

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) node.setAttribute(k, v);
  }
  for (const child of [].concat(children)) {
    if (child === null || child === undefined) continue;
    node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
  }
  return node;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function showError(container, err) { container.appendChild(el('div', { class: 'error' }, err.message)); }

/* ============================== router ============================== */

const app = document.getElementById('app');

function currentRoute() {
  const hash = location.hash.replace(/^#\/?/, '');
  const parts = hash.split('/').filter(Boolean);
  return parts.length ? parts : ['classes'];
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => {
  if (!location.hash) location.hash = '#/classes';
  render();
});

function render() {
  const parts = currentRoute();
  document.querySelectorAll('nav a').forEach((a) => {
    a.classList.toggle('active', parts[0] && a.getAttribute('href') === `#/${parts[0]}`);
  });
  clear(app);
  try {
    if (parts[0] === 'classes' && parts[1]) renderClassDetail(Number(parts[1]), parts[2] || 'roster');
    else if (parts[0] === 'students' && parts[1]) renderStudentDetail(Number(parts[1]));
    else if (parts[0] === 'students') renderStudentsList();
    else renderClassesList();
  } catch (err) {
    app.appendChild(el('div', { class: 'panel' }, [showErrorInline(err)]));
  }
}

function linkBack(label, href) {
  const a = el('a', {}, label);
  a.addEventListener('click', () => { location.hash = href; });
  return a;
}
function studentLink(label, studentId) {
  const a = el('a', { class: 'student-link' }, label);
  a.addEventListener('click', (e) => { e.stopPropagation(); location.hash = `#/students/${studentId}`; });
  return a;
}
function showErrorInline(err) { return el('div', { class: 'error' }, err.message); }

// Day + time dropdown pair with an "Add slot" button and removable chips.
// Returns { element, getSlots() } so a form can pull the current list on submit.
function buildSlotPicker(initialSlots = []) {
  // Lenient on the way in (silently drops anything malformed, e.g. slots
  // saved before the end-time picker existed) — validSlots() is still the
  // strict gate applied on save, in Store.createClass/updateClass.
  let slots = (Array.isArray(initialSlots) ? initialSlots : []).filter(isValidSlot);
  const daySelect = el('select');
  for (const d of DAYS) daySelect.appendChild(el('option', { value: d.code }, d.label));
  const startSelect = el('select');
  for (const t of TIMES) startSelect.appendChild(el('option', { value: t }, formatTime(t)));
  const endSelect = el('select');
  const addBtn = el('button', { type: 'button', class: 'secondary' }, '+ Add');
  const chipRow = el('div', { class: 'slot-chips' });

  function refreshEndOptions() {
    const previous = endSelect.value;
    clear(endSelect);
    const options = END_TIMES.filter((t) => t > startSelect.value);
    for (const t of options) endSelect.appendChild(el('option', { value: t }, formatTime(t)));
    const defaultEnd = addMinutes(startSelect.value, 20);
    endSelect.value = options.includes(previous) ? previous : (options.includes(defaultEnd) ? defaultEnd : options[0]);
  }
  startSelect.addEventListener('change', refreshEndOptions);
  refreshEndOptions();

  function renderChips() {
    clear(chipRow);
    if (!slots.length) {
      chipRow.appendChild(el('span', { class: 'muted' }, 'No slots added yet'));
      return;
    }
    slots.forEach((s, i) => {
      const remove = el('button', { type: 'button', class: 'chip-remove' }, '×');
      remove.addEventListener('click', () => { slots.splice(i, 1); renderChips(); });
      chipRow.appendChild(el('span', { class: 'chip' }, [`${s.day} ${formatTime(s.time)}–${formatTime(s.end)}`, remove]));
    });
  }
  renderChips();

  addBtn.addEventListener('click', () => {
    const slot = { day: daySelect.value, time: startSelect.value, end: endSelect.value };
    if (slots.some((s) => s.day === slot.day && s.time === slot.time && s.end === slot.end)) return;
    slots = validSlots([...slots, slot], 'slot');
    renderChips();
  });

  const element = el('div', {}, [
    el('div', { class: 'row slot-row' }, [daySelect, startSelect, el('span', { class: 'slot-to' }, 'to'), endSelect, addBtn]),
    chipRow,
  ]);
  return { element, getSlots: () => slots };
}

function renderClassDetail(id, subtab) {
  clear(app);
  const cls = Store.getClass(id);
  if (!cls) { app.appendChild(el('div', { class: 'panel' }, [el('p', {}, 'Class not found.'), linkBack('Back to classes', '#/classes')])); return; }

  app.appendChild(el('div', { class: 'crumbs' }, [linkBack('Classes', '#/classes'), ' / ', el('strong', {}, cls.name)]));

  if (subtab === 'edit') {
    const editPanel = el('div', { class: 'panel' });
    app.appendChild(editPanel);
    renderClassEdit(editPanel, cls, id);
    return;
  }

  const infoItems = [
    cls.subject ? el('span', {}, ['Subject ', el('strong', {}, cls.subject)]) : null,
    cls.venue ? el('span', {}, ['Venue ', el('strong', {}, cls.venue)]) : null,
    cls.odd_week_slots && cls.odd_week_slots.length ? el('span', {}, ['Odd wk ', el('strong', {}, formatSlots(cls.odd_week_slots))]) : null,
    cls.even_week_slots && cls.even_week_slots.length ? el('span', {}, ['Even wk ', el('strong', {}, formatSlots(cls.even_week_slots))]) : null,
  ].filter(Boolean);
  const editBtn = el('button', { class: 'secondary' }, 'Edit class');
  editBtn.addEventListener('click', () => { location.hash = `#/classes/${id}/edit`; });
  app.appendChild(el('div', { class: 'class-header-row' }, [
    infoItems.length ? el('div', { class: 'profile-meta' }, infoItems) : el('div', {}),
    editBtn,
  ]));

  const subtabs = el('div', { class: 'subtabs' });
  for (const [key, label] of [['roster', 'Roster'], ['attendance', 'Attendance'], ['gradebook', 'Gradebook'], ['lessons', 'Lesson Plans']]) {
    const btn = el('button', { class: key === subtab ? 'active' : '' }, label);
    btn.addEventListener('click', () => { location.hash = `#/classes/${id}/${key}`; });
    subtabs.appendChild(btn);
  }
  app.appendChild(subtabs);

  const panel = el('div', { class: 'panel' });
  app.appendChild(panel);

  if (subtab === 'attendance') return renderAttendance(panel, cls);
  if (subtab === 'gradebook') return renderGradebook(panel, cls, id);
  if (subtab === 'lessons') return renderLessons(panel, cls, id);
  return renderRoster(panel, cls, id);
}

function renderAttendance(panel, cls) {
  panel.appendChild(el('h2', {}, 'Attendance'));

  const today = new Date().toISOString().slice(0, 10);
  const dateInput = el('input', { type: 'date', value: today });

  const saveBtn = el('button', {}, 'Save attendance');
  const errBox = el('div', {});
  panel.append(saveBtn, errBox);

  let currentRoster = [];

  function loadForDate() {
    clear(tableWrap);
    clear(errBox);
    currentRoster = Store.getAttendanceForDate(cls.id, dateInput.value);
    const table = el('table');
    table.appendChild(el('thead', {}, el('tr', {}, [el('th', {}, 'Student'), el('th', {}, 'Status'), el('th', {}, 'Notes')])));
    const tbody = el('tbody');
    for (const r of currentRoster) {
      const btnGroup = el('div', { class: 'status-btns' });
      for (const status of STATUSES) {
        const b = el('button', { type: 'button', class: status === r.status ? `selected ${status}` : '' }, status);
        b.addEventListener('click', () => {
          r.status = status;
          btnGroup.querySelectorAll('button').forEach((x) => { x.className = x.textContent === status ? `selected ${status}` : ''; });
        });
        btnGroup.appendChild(b);
      }
      const notesInput = el('input', { value: r.notes || '', maxlength: '500' });
      notesInput.addEventListener('input', () => { r.notes = notesInput.value; });
      tbody.appendChild(el('tr', {}, [el('td', {}, studentLink(r.name, r.student_id)), el('td', {}, btnGroup), el('td', {}, notesInput)]));
    }
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    if (!currentRoster.length) tableWrap.appendChild(el('p', { class: 'muted' }, 'No students enrolled in this class yet.'));
  }

  dateInput.addEventListener('change', loadForDate);
  saveBtn.addEventListener('click', () => {
    clear(errBox);
    const records = currentRoster.filter((r) => r.status).map((r) => ({ enrollment_id: r.enrollment_id, status: r.status, notes: r.notes || undefined }));
    if (!records.length) { showError(errBox, new Error('Mark at least one status before saving.')); return; }
    try {
      Store.saveAttendance(cls.id, dateInput.value, records);
      loadForDate();
      errBox.appendChild(el('div', { class: 'notice' }, 'Saved.'));

}

    el('div', {}, [el('label', {}, 'Max points'), maxPoints]),
    el('div', {}, [el('label', {}, 'Due date'), dueDate]),
    addBtn
  );

    e.preventDefault();

      Store.createAssignment(classId, { name: name.value, category: category.value, max_points: maxPoints.value, due_date: dueDate.value || undefined });
      renderClassDetail(classId, 'gradebook');
    } catch (err) { showError(addErr, err); }
  });

  panel.append(tableWrap, saveBtn, errBox);

  const assignments = gb.assignments;

  const pendingScores = new Map();

  if (!assignments.length) {
    tableWrap.appendChild(el('p', { class: 'muted' }, 'No assignments yet. Add one above.'));
  } else if (!students.length) {
    tableWrap.appendChild(el('p', { class: 'muted' }, 'No students enrolled in this class yet.'));
  } else {
    const table = el('table');
    const headRow = el('tr', {}, [el('th', {}, 'Student')]);
    for (const a of assignments) {
      const del = el('button', { class: 'secondary' }, '×');
      del.title = `Delete ${a.name}`;
      del.addEventListener('click', (e) => {
        e.preventDefault();
        if (!confirm(`Delete assignment "${a.name}"?`)) return;
        Store.deleteAssignment(a.id);
        renderClassDetail(classId, 'gradebook');
      });
      headRow.appendChild(el('th', {}, [`${a.name} (/${a.max_points})`, ' ', del]));

    table.appendChild(el('thead', {}, headRow));

    const tbody = el('tbody');
    for (const s of students) {
      const row = el('tr', {}, [el('td', {}, studentLink(s.name, s.student_id))]);
      for (const a of assignments) {
        const val = s.scores[a.id];
        const input = el('input', { class: 'score-input', type: 'number', min: '0', step: '0.01', value: val === null || val === undefined ? '' : String(val) });
        input.addEventListener('input', () => {
          const key = `${a.id}:${s.enrollment_id}`;
          pendingScores.set(key, { assignment_id: a.id, enrollment_id: s.enrollment_id, score: input.value === '' ? null : Number(input.value) });
        });
        row.appendChild(el('td', {}, input));
      }
      tbody.appendChild(row);
    }
    table.appendChild(tbody);
    tableWrap.appendChild(table);
  }

  saveBtn.addEventListener('click', () => {
    clear(errBox);
    if (!pendingScores.size) return;
    const byAssignment = new Map();
    for (const rec of pendingScores.values()) {
      if (!byAssignment.has(rec.assignment_id)) byAssignment.set(rec.assignment_id, []);
      byAssignment.get(rec.assignment_id).push({ enrollment_id: rec.enrollment_id, score: rec.score });
    }
    try {
      for (const [assignmentId, records] of byAssignment) Store.saveGrades(assignmentId, records);
      renderClassDetail(classId, 'gradebook');
    } catch (err) { showError(errBox, err); }
  });
}

// Self-contained card: toggles between a view and an edit form in place,
// so editing one lesson never disturbs the rest of the list.
function buildLessonCard(lesson, onChange) {
  const card = el('div', { class: 'lesson-card' });

  function renderView() {
    clear(card);
    const editBtn = el('button', { class: 'secondary' }, 'Edit');
    const delBtn = el('button', { class: 'danger' }, 'Delete');
    editBtn.addEventListener('click', renderEdit);
    delBtn.addEventListener('click', () => {
      if (!confirm(`Delete lesson "${lesson.topic}"?`)) return;
      Store.deleteLesson(lesson.id);
      onChange();
    });
    card.appendChild(el('div', { class: 'lesson-card-header' }, [
      el('div', {}, [
        lesson.date ? el('span', { class: 'lesson-date' }, lesson.date) : null,
        el('h4', {}, lesson.topic),
      ].filter(Boolean)),
      el('div', { class: 'edit-actions' }, [editBtn, delBtn]),
    ]));
    if (lesson.objectives) card.appendChild(lessonField('Objectives', lesson.objectives));
    if (lesson.resources) card.appendChild(lessonField('Resources', lesson.resources));
    if (lesson.notes) card.appendChild(lessonField('Notes', lesson.notes));
  }

  function renderEdit() {
    clear(card);
    const form = el('form', { class: 'row' });
    const date = el('input', { type: 'date', value: lesson.date || '' });
    const topic = el('input', { value: lesson.topic, required: 'true', maxlength: '200' });
    const objectives = el('textarea', { maxlength: '2000' }, lesson.objectives || '');
    const resources = el('input', { value: lesson.resources || '', maxlength: '500' });
    const notes = el('textarea', { maxlength: '2000' }, lesson.notes || '');
    form.append(
      el('div', {}, [el('label', {}, 'Date'), date]),
      el('div', {}, [el('label', {}, 'Topic'), topic]),
      el('div', { style: 'flex-basis:100%' }, [el('label', {}, 'Objectives'), objectives]),
      el('div', {}, [el('label', {}, 'Resources'), resources]),
      el('div', { style: 'flex-basis:100%' }, [el('label', {}, 'Notes'), notes])
    );
    const errBox = el('div', {});
    const saveBtn = el('button', { type: 'submit' }, 'Save');
    const cancelBtn = el('button', { type: 'button', class: 'secondary' }, 'Cancel');
    form.appendChild(el('div', { class: 'edit-actions' }, [saveBtn, cancelBtn]));
    cancelBtn.addEventListener('click', renderView);
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      clear(errBox);
      try {
        Store.updateLesson(lesson.id, {
          date: date.value || undefined, topic: topic.value,
          objectives: objectives.value || undefined, resources: resources.value || undefined, notes: notes.value || undefined,
        });
        Object.assign(lesson, {
          date: date.value || null, topic: topic.value,
          objectives: objectives.value || null, resources: resources.value || null, notes: notes.value || null,
        });
        renderView();
      } catch (err) { showError(errBox, err); }
    });
    card.append(form, errBox);
  }

  renderView();
  return card;
}

function buildNewLessonForm(classId, onCreated) {
  const form = el('form', { class: 'row' });
  const date = el('input', { type: 'date' });
  const topic = el('input', { placeholder: 'Topic', required: 'true', maxlength: '200' });
  const objectives = el('textarea', { placeholder: 'Learning objectives', maxlength: '2000' });
  const resources = el('input', { placeholder: 'Resources', maxlength: '500' });
  const notes = el('textarea', { placeholder: 'Notes / activities', maxlength: '2000' });
  const submit = el('button', { type: 'submit' }, 'Add lesson');
  form.append(
    el('div', {}, [el('label', {}, 'Date'), date]),
    el('div', {}, [el('label', {}, 'Topic'), topic]),
    el('div', { style: 'flex-basis:100%' }, [el('label', {}, 'Objectives'), objectives]),
    el('div', {}, [el('label', {}, 'Resources'), resources]),
    el('div', { style: 'flex-basis:100%' }, [el('label', {}, 'Notes'), notes]),
    submit
  );
  const errBox = el('div', {});
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    clear(errBox);
    try {
      Store.createLesson(classId, {
        date: date.value || undefined, topic: topic.value,
        objectives: objectives.value || undefined, resources: resources.value || undefined, notes: notes.value || undefined,
      });
      onCreated();
    } catch (err) { showError(errBox, err); }
  });
  return { form, errBox };
}

/* ============================== Students ============================== */

function renderStudentsList() {
  clear(app);
  const panel = el('div', { class: 'panel' }, [el('h2', {}, 'Students')]);
  app.appendChild(panel);

  const form = el('form', { class: 'row' });
  const fullName = el('input', { placeholder: 'Full name', required: 'true', maxlength: '200' });
  const name = el('input', { placeholder: 'Name (preferred)', required: 'true', maxlength: '100' });
  const formClass = el('input', { placeholder: 'Form class', required: 'true', maxlength: '50' });
  const email = el('input', { type: 'email', placeholder: 'Email (optional)', maxlength: '254' });
  const submit = el('button', { type: 'submit' }, 'Add student');
  form.append(
    el('div', {}, [el('label', {}, 'Full name'), fullName]),
    el('div', {}, [el('label', {}, 'Name'), name]),
    el('div', {}, [el('label', {}, 'Form class'), formClass]),
    el('div', {}, [el('label', {}, 'Email'), email]),
    submit
  );
  const errBox = el('div', {});
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    clear(errBox);
    try {
      Store.createStudent({ full_name: fullName.value, name: name.value, form_class: formClass.value, email: email.value || undefined });
      renderStudentsList();
    } catch (err) { showError(errBox, err); }
  });
  panel.append(form, errBox);

  const searchBox = el('input', { placeholder: 'Search students…', style: 'margin-bottom:12px;width:100%' });
  const listPanel = el('div', { class: 'panel' });
  app.append(searchBox, listPanel);

  function load(q) {
    clear(listPanel);
    const students = Store.listStudents(q);
    if (!students.length) {
      listPanel.appendChild(el('p', { class: 'muted' }, 'No students found.'));
      return;
    }
    const table = el('table');
    table.appendChild(el('thead', {}, el('tr', {}, [el('th', {}, 'Name'), el('th', {}, 'Full Name'), el('th', {}, 'Form Class'), el('th', {}, '')])));
    const tbody = el('tbody');
    for (const s of students) {
      const del = el('button', { class: 'danger' }, 'Delete');
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!confirm(`Delete ${s.full_name}? This removes their enrollments, attendance, and grades.`)) return;
        Store.deleteStudent(s.id);
        load(searchBox.value);
      });
      const tr = el('tr', { class: 'clickable' }, [
        el('td', {}, studentLink(s.name, s.id)),
        el('td', {}, s.full_name),
        el('td', { class: 'form-class' }, s.form_class),
        el('td', {}, del),
      ]);
      tr.addEventListener('click', () => { location.hash = `#/students/${s.id}`; });
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    listPanel.appendChild(table);
  }

  let debounceTimer;
  searchBox.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => load(searchBox.value), 200);
  });
  load('');
}

function renderStudentDetail(id) {
  clear(app);
  const student = Store.getStudent(id);
  if (!student) { app.appendChild(el('div', { class: 'panel' }, [el('p', {}, 'Student not found.'), linkBack('Back to students', '#/students')])); return; }

  app.appendChild(el('div', { class: 'crumbs' }, [linkBack('Students', '#/students'), ' / ', el('strong', {}, student.name)]));

  const panel = el('div', { class: 'panel' });
  app.appendChild(panel);
  renderStudentView(panel, id);
}

function renderStudentView(panel, id) {
  clear(panel);
  const student = Store.getStudent(id);
  if (!student) return;

  const editBtn = el('button', { class: 'secondary' }, 'Edit');
  editBtn.addEventListener('click', () => renderStudentEdit(panel, id));
  panel.appendChild(el('div', { class: 'panel-header' }, [el('h2', {}, student.name), editBtn]));

  panel.appendChild(el('div', { class: 'profile-meta' }, [
    el('span', {}, ['Full name ', el('strong', {}, student.full_name)]),
    el('span', {}, ['Form class ', el('strong', {}, student.form_class)]),
  ]));
  if (student.email) panel.appendChild(el('p', { class: 'muted' }, student.email));
  if (student.notes) panel.appendChild(el('p', {}, student.notes));

  panel.appendChild(el('h3', {}, 'Enrolled classes'));
  if (!student.classes.length) {
    panel.appendChild(el('p', { class: 'muted' }, 'Not enrolled in any classes yet.'));
  } else {
    const table = el('table');
    table.appendChild(el('thead', {}, el('tr', {}, [el('th', {}, 'Subject'), el('th', {}, 'Class'), el('th', {}, 'Venue'), el('th', {}, '')])));
    const tbody = el('tbody');
    for (const c of student.classes) {
      const remove = el('button', { class: 'secondary' }, 'Unenroll');
      remove.addEventListener('click', () => { Store.unenroll(c.enrollment_id); renderStudentView(panel, id); });
      tbody.appendChild(el('tr', {}, [el('td', {}, c.subject || ''), el('td', {}, c.name), el('td', {}, c.venue || ''), el('td', {}, remove)]));
    }
    table.appendChild(tbody);
    panel.appendChild(table);
  }
}

function renderStudentEdit(panel, id) {
  clear(panel);
  const student = Store.getStudent(id);
  if (!student) return;

  panel.appendChild(el('h2', {}, `Edit ${student.name}`));

  const form = el('form', { class: 'row' });
  const fullName = el('input', { value: student.full_name, required: 'true', maxlength: '200' });
  const name = el('input', { value: student.name, required: 'true', maxlength: '100' });
  const formClass = el('input', { value: student.form_class, required: 'true', maxlength: '50' });
  const email = el('input', { type: 'email', value: student.email || '', maxlength: '254' });
  const notes = el('textarea', { maxlength: '2000' }, student.notes || '');

  form.append(
    el('div', {}, [el('label', {}, 'Full name'), fullName]),
    el('div', {}, [el('label', {}, 'Name'), name]),
    el('div', {}, [el('label', {}, 'Form class'), formClass]),
    el('div', {}, [el('label', {}, 'Email'), email]),
    el('div', { style: 'flex-basis:100%' }, [el('label', {}, 'Notes'), notes])
  );

  const errBox = el('div', {});
  const saveBtn = el('button', { type: 'submit' }, 'Save');
  const cancelBtn = el('button', { type: 'button', class: 'secondary' }, 'Cancel');
  form.appendChild(el('div', { class: 'edit-actions' }, [saveBtn, cancelBtn]));

  cancelBtn.addEventListener('click', () => renderStudentView(panel, id));
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    clear(errBox);
    try {
      Store.updateStudent(id, {
        full_name: fullName.value, name: name.value, form_class: formClass.value,
        email: email.value || undefined, notes: notes.value || undefined,
      });
      renderStudentView(panel, id);
    } catch (err) { showError(errBox, err); }
  });

  panel.append(form, errBox);
}

/* ============================== backup: export / import ============================== */

document.getElementById('export-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `classroom-tracker-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

const fileInput = document.getElementById('file-input');
document.getElementById('import-btn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const required = ['classes', 'students', 'enrollments', 'attendance', 'assignments', 'grades'];
      if (!required.every((k) => Array.isArray(parsed[k]))) throw new Error('This file does not look like a Classroom Tracker backup.');
      if (!confirm('Import this backup? This will replace all data currently in this browser.')) return;
      state = { ...emptyState(), ...parsed };
      persist();
      render();
      alert('Backup imported.');
    } catch (err) {
      alert('Could not import file: ' + err.message);
    } finally {
      fileInput.value = '';
    }
  };
  reader.readAsText(file);
});
</script>
