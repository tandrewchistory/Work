<style data-keep>
:root {

  --bg: #f4f4f1;

  --surface-2: #f0efec;

  --text: #0b0b0b;

  --muted: #74736e;
  --accent: #2a78d6;
  --accent-ink: #1c5cab;
  --accent-soft: #e3eefb;
  --series: #2a78d6;
  --track: #ebeae6;
  --good: #0ca30c;
  --warn: #fab219;
  --serious: #ec835a;
  --crit: #d03b3b;
  --danger-ink: #b02a2a;
  --shadow: 0 1px 2px rgba(0,0,0,.05);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #34342f;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #94938b;
    --accent: #3987e5; --accent-ink: #86b6ef; --accent-soft: #1d2a3b;
    --series: #3987e5; --track: #2b2b28; --danger-ink: #f08a8a; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #34342f;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #94938b;
  --accent: #3987e5; --accent-ink: #86b6ef; --accent-soft: #1d2a3b;
  --series: #3987e5; --track: #2b2b28; --danger-ink: #f08a8a; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; }
a { color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }

/* ---------- header & nav ---------- */
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
.topbar-inner { max-width: 1180px; margin: 0 auto; padding: 12px 16px 0; }
.title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.title-row h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
.save-state { font-size: 12.5px; color: var(--muted); }
.save-state.dirty { color: var(--text); font-weight: 600; }
.save-state.dirty::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); margin-right: 6px; vertical-align: 1px; }
.title-actions { margin-left: auto; display: flex; gap: 8px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; }
nav.tabs button { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 12px 10px; cursor: pointer; color: var(--text-2); white-space: nowrap; font-weight: 500; }
nav.tabs button:hover { color: var(--text); }
nav.tabs button.active { color: var(--accent-ink); border-bottom-color: var(--accent); }
main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 48px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 13.5px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger-ink); }
.btn.small { padding: 4px 9px; font-size: 12.5px; }
.btn.link { border: none; background: none; padding: 0; color: var(--accent-ink); }
.btn.link:hover { text-decoration: underline; background: none; }
input[type=text], input[type=search], input[type=date], input[type=time], input[type=number], select, textarea {
  padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); min-width: 0;
}
textarea { width: 100%; min-height: 110px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-2); font-weight: 500; }
label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); cursor: pointer; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 14px; }
.toolbar .grow { flex: 1 1 200px; }
.toolbar .grow input { width: 100%; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.form-grid .wide { grid-column: 1 / -1; }
.form-grid input, .form-grid select { width: 100%; }
.cca-picks label { white-space: nowrap; justify-content: flex-start; }
.form-grid .cca-picks input { width: auto; margin: 0; }
.cca-picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 6px 14px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); }
.form-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

/* ---------- panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; box-shadow: var(--shadow); min-width: 0; }
.panel h2 { font-size: 15px; margin: 0 0 2px; }
.panel .sub { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; }
.panel-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.panel-head h2 { margin: 0; }
.panel-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.grid-2 > .panel { margin-bottom: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.banner { border: 1px solid var(--border); border-left: 4px solid var(--warn); background: var(--surface); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner .right { margin-left: auto; display: flex; gap: 8px; }
.empty { color: var(--muted); padding: 18px 4px; text-align: center; }
.muted { color: var(--muted); }
.crumbs { margin-bottom: 12px; font-size: 13px; }

/* ---------- KPI tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
.tile .k { font-size: 11.5px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
.tile .v { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 0; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12px; color: var(--muted); }
.tile.alert .v::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--crit); margin-left: 8px; vertical-align: 6px; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 11.5px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; background: var(--surface); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
tr.past td { color: var(--muted); }
td .stack-name { display: flex; flex-direction: column; }
td .stack-name small { color: var(--muted); font-size: 12px; }
td select, td input[type=text], td input[type=number] { padding: 4px 6px; font-size: 13px; }
td input[type=number] { width: 70px; }
.nowrap { white-space: nowrap; }

/* ---------- chips (status = icon + label, never colour alone) ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; }
.chip .ic { font-size: 11px; line-height: 1; }
.chip.good .ic { color: var(--good); }
.chip.warn .ic { color: var(--warn); }
.chip.serious .ic { color: var(--serious); }
.chip.crit .ic { color: var(--crit); }
.chip.info .ic { color: var(--accent); }
.chip.dim { color: var(--muted); font-weight: 500; }
.chip.dim .ic { color: var(--muted); }
.chip.withdrawn { color: var(--muted); text-decoration: line-through; font-weight: 500; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 5px; background: var(--surface-2); color: var(--text-2); font-size: 12px; }
.name-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.name-chips button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; }
.name-chips button:hover { border-color: var(--accent); }
.name-chips button small { color: var(--muted); margin-left: 4px; }

/* ---------- charts ---------- */
.hbar { display: grid; grid-template-columns: minmax(90px, max-content) 1fr auto; column-gap: 10px; row-gap: 8px; align-items: center; }
.hbar .lbl { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
.hbar .track { height: 14px; position: relative; border-radius: 0 4px 4px 0; cursor: default; }
.hbar .track::before { content: ""; position: absolute; inset: 6px 0; background: var(--track); border-radius: 2px; }
.hbar .bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--series); border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar .track:hover .bar { filter: brightness(1.12); }
.hbar .val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
.fill { display: flex; align-items: center; gap: 8px; min-width: 110px; }
.fill .t { flex: 1; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.fill .t span { display: block; height: 100%; background: var(--series); border-radius: 0 4px 4px 0; }
.fill .p { font-size: 12px; color: var(--text-2); width: 3.5em; text-align: right; font-variant-numeric: tabular-nums; }
.tooltip { position: fixed; z-index: 50; pointer-events: none; background: var(--text); color: var(--surface); padding: 6px 9px; border-radius: 6px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.18); max-width: 260px; }
.tooltip b { display: block; }

/* ---------- assign picker ---------- */
.pick-list { max-height: 360px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
.pick-row { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; padding: 7px 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
.pick-row:last-child { border-bottom: none; }
.pick-row:hover { background: var(--surface-2); }
.pick-row .who small { display: block; color: var(--muted); font-size: 12px; }
.pick-row .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.count-pill { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-2); background: var(--surface-2); border-radius: 999px; padding: 1px 8px; }

.detail-meta { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--text-2); margin: 6px 0 2px; }
.detail-meta b { color: var(--text); font-weight: 600; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--surface); padding: 9px 16px; border-radius: 8px; font-size: 13.5px; z-index: 60; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
.help p, .help li { color: var(--text-2); }
.help h3 { font-size: 14px; margin: 16px 0 4px; }
.help ol, .help ul { padding-left: 20px; margin: 4px 0; }

@media (max-width: 640px) {

  .hbar .lbl { max-width: 120px; }

  .topbar { position: static; border: none; }
  body { background: #fff; }
  .panel, .tile { box-shadow: none; break-inside: avoid; }
}

<script data-keep>
'use strict';
/* =====================================================================

   All data lives in the JSON block above (#sld-data). "Save" writes a

const STATUSES = ['Confirmed', 'Tentative', 'Completed', 'Withdrawn'];
const DEFAULT_LISTS = {
  categories: ['Ceremony', 'School Event', 'Assembly', 'Sports', 'Community Service', 'Open House', 'Camp', 'External'],
  roles: ['Emcee', 'Usher', 'Marshal', 'Registration', 'Logistics', 'Facilitator', 'Group Leader', 'Photographer', 'Tech Crew'],

    'Red Cross Youth', 'Robotics Club', 'Media Club', 'Library Club'],
};

    version: 1,

}

let data = normalize(JSON.parse(document.getElementById('sld-data').textContent || '{}'));

/* ---------------------------------------------------------------- utils */
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (k === 'value') node.value = v;
    else if (k === 'checked') node.checked = !!v;
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of [].concat(children ?? [])) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }

}
function appendAll(node, ...kids) { node.append(...kids.filter(k => k !== null && k !== undefined && k !== false)); }
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const byName = (a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' });
const pad = n => String(n).padStart(2, '0');
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function addDays(iso, n) { const [y, m, d] = iso.split('-').map(Number); const t = new Date(y, m - 1, d + n); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`; }
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function fmtDate(iso, withYear = true) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-').map(Number);
  const dow = DAYS[new Date(y, m - 1, d).getDay()];
  return `${dow} ${d} ${MONTHS[m - 1]}${withYear ? ' ' + y : ''}`;
}
function fmtTime(t) { if (!t) return ''; const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${pad(m)}${h < 12 ? 'am' : 'pm'}`; }
function fmtStamp(iso) { const d = new Date(iso); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}, ${fmtTime(pad(d.getHours()) + ':' + pad(d.getMinutes()))}`; }
const fmtHours = h => (Math.round(h * 10) / 10).toLocaleString(undefined, { maximumFractionDigits: 1 });
const ccaText = s => (s.ccas || []).join(', ');
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0) + '%';
function hoursOf(a) {
  if (!a || !a.start || !a.end) return 0;
  const [h1, m1] = a.start.split(':').map(Number), [h2, m2] = a.end.split(':').map(Number);
  let mins = h2 * 60 + m2 - (h1 * 60 + m1);
  if (mins < 0) mins += 24 * 60;
  return mins / 60;
}
function uniqueSorted(values) { return [...new Set(values.filter(Boolean))].sort(byName); }

/* ---------------------------------------------------------------- derived data */
function computeStats(opts = {}) {
  const { from = '', to = '', form = '', cca = '' } = opts;
  const today = todayStr(), soon = addDays(today, Number(data.settings.upcomingDays) || 14);
  const inRange = a => (!from || (a.date && a.date >= from)) && (!to || (a.date && a.date <= to));
  const acts = data.activities.filter(inRange);
  const actIds = new Set(acts.map(a => a.id));
  const stuById = new Map(data.students.map(s => [s.id, s]));
  const actById = new Map(data.activities.map(a => [a.id, a]));
  const deps = data.deployments.filter(d => actIds.has(d.activityId) && stuById.has(d.studentId));
  const active = deps.filter(d => d.status !== 'Withdrawn');
  const high = Number(data.settings.highLoad) || 4;

  const act = new Map();
  for (const a of acts) {
    act.set(a.id, { assigned: 0, hours: hoursOf(a) });
  }
  for (const d of active) act.get(d.activityId).assigned++;
  for (const a of acts) {
    const s = act.get(a.id), need = Number(a.needed) || 0;
    s.needed = need;
    s.open = Math.max(0, need - s.assigned);
    s.fill = need ? s.assigned / need : null;
    s.staffing = !need ? 'No target' : s.assigned > need ? 'Over-staffed' : s.assigned === need ? 'Fully staffed' : s.assigned === 0 ? 'Unstaffed' : 'Short';
    s.timing = !a.date ? 'No date' : a.date < today ? 'Past' : a.date <= soon ? 'Upcoming' : 'Later';
  }

  const students = data.students.filter(s => (!form || s.formClass === form) && (!cca || s.ccas.includes(cca)));
  const stu = new Map(students.map(s => [s.id, { count: 0, hours: 0, latest: '' }]));
  for (const d of active) {
    const s = stu.get(d.studentId);
    if (!s) continue;
    const a = actById.get(d.activityId);
    s.count++;
    s.hours += d.hours !== null && d.hours !== undefined && d.hours !== '' ? Number(d.hours) || 0 : act.get(a.id).hours;
    if (a.date && a.date > s.latest) s.latest = a.date;
  }
  for (const s of stu.values()) s.load = s.count === 0 ? 'Not deployed' : s.count >= high ? 'High load' : 'Deployed';
  return { acts, act, deps, active, students, stu, stuById, actById, high, today };
}

/* All-time stats (for the editing views). */
const allStats = () => computeStats();

function depHours(d, stats) {
  if (d.status === 'Withdrawn') return 0;
  if (d.hours !== null && d.hours !== undefined && d.hours !== '') return Number(d.hours) || 0;
  return hoursOf(stats.actById.get(d.activityId));
}

/* ---------------------------------------------------------------- chips */
const STAFF_CHIP = {
  'Fully staffed': ['good', '✓'], 'Short': ['warn', '◐'], 'Unstaffed': ['crit', '✕'],
  'Over-staffed': ['info', '+'], 'No target': ['dim', '–'],
};
const LOAD_CHIP = { 'Not deployed': ['serious', '○'], 'Deployed': ['good', '✓'], 'High load': ['warn', '▲'] };
const DEP_CHIP = { Completed: ['good', '✓'], Confirmed: ['info', '●'], Tentative: ['dim', '◌'], Withdrawn: ['withdrawn', '✕'] };
function chip(map, label) {
  const [cls, icon] = map[label] || ['dim', '•'];
  return el('span', { class: 'chip ' + cls }, [el('span', { class: 'ic', 'aria-hidden': 'true', text: icon }), label]);
}
function timingTag(t) { return t === 'Upcoming' ? el('span', { class: 'chip info' }, [el('span', { class: 'ic', text: '◷' }), 'Upcoming']) : el('span', { class: 'muted', text: t }); }

/* ---------------------------------------------------------------- tooltip & toast */
let tipEl = null;
function showTip(e, html) {
  if (!tipEl) { tipEl = el('div', { class: 'tooltip', role: 'tooltip' }); document.body.append(tipEl); }
  tipEl.replaceChildren(...html);
  tipEl.style.display = 'block';
  const x = Math.min(e.clientX + 14, window.innerWidth - tipEl.offsetWidth - 8);
  const y = Math.max(8, e.clientY - tipEl.offsetHeight - 10);
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}
function hideTip() { if (tipEl) tipEl.style.display = 'none'; }
let toastTimer = null;
function toast(msg) {
  let t = document.querySelector('.toast');
  if (!t) { t = el('div', { class: 'toast', role: 'status' }); document.body.append(t); }
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2600);
}

/* ---------------------------------------------------------------- persistence */
function commit(msg) {
  dirty = true;
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ base: baseRevision, at: Date.now(), data })); } catch (_) { /* storage unavailable */ }
  render();
  if (msg) toast(msg);
}
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (_) { /* ignore */ } }
function loadDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return null;
    const draft = JSON.parse(raw);
    if (JSON.stringify(normalize(draft.data)) === JSON.stringify(data)) { clearDraft(); return null; }
    return draft;
  } catch (_) { return null; }
}
function userName() {
  let n = '';
  try { n = localStorage.getItem(NAME_KEY) || ''; } catch (_) { /* ignore */ }
  if (!n) {
    n = (prompt('Your name — recorded with each save so colleagues know who updated the file:') || '').trim();
    if (!n) return null;
    try { localStorage.setItem(NAME_KEY, n); } catch (_) { /* ignore */ }
  }
  return n;
}
function fileName() {
  const f = decodeURIComponent(location.pathname.split('/').pop() || '');
  return /\.html?$/i.test(f) ? f : 'student-leader-deployment.html';
}
function serialize(next) {
  const root = document.documentElement.cloneNode(true);
  for (const part of [root.querySelector('head'), root.querySelector('body')]) {
    for (const c of [...part.children]) if (!c.hasAttribute('data-keep')) c.remove();
  }
  root.querySelector('#app').replaceChildren();
  root.removeAttribute('data-theme');
  root.querySelector('body').removeAttribute('class');
  root.querySelector('#sld-data').textContent = JSON.stringify(next).replace(/</g, '\\u003c');
  return '<!doctype html>\n' + root.outerHTML;
}
function readRevision(html) {
  const m = html.match(/id="sld-data"[^>]*>([\s\S]*?)<\/script>/);
  if (!m) return null;
  try { const d = JSON.parse(m[1]); return { revision: Number(d.revision) || 0, savedBy: d.savedBy, savedAt: d.savedAt }; } catch (_) { return null; }
}
function download(text, name) {
  const url = URL.createObjectURL(new Blob([text], { type: 'text/html' }));
  const a = el('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function afterSave(next, how) {
  data = next; baseRevision = next.revision; dirty = false; pendingDraft = null;
  clearDraft(); render(); toast(how);
}
async function save() {
  const who = userName();
  if (who === null) return;
  const next = { ...data, revision: baseRevision + 1, savedAt: new Date().toISOString(), savedBy: who };
  const html = serialize(next);
  if (typeof window.showSaveFilePicker === 'function') {
    try {
      if (!fileHandle) {
        if (!confirm(`A save window will open.\n\nSelect THIS file on the shared drive ("${fileName()}") and choose Replace / Yes.\nYou only need to do this once while the page is open.`)) return;
        fileHandle = await window.showSaveFilePicker({
          suggestedName: fileName(),
          types: [{ description: 'Dashboard (HTML)', accept: { 'text/html': ['.html', '.htm'] } }],
        });
      }
      const onDisk = readRevision(await (await fileHandle.getFile()).text());
      if (onDisk && onDisk.revision !== baseRevision) {
        const when = onDisk.savedAt ? ' on ' + fmtStamp(onDisk.savedAt) : '';
        if (!confirm(`${onDisk.savedBy || 'Someone'} saved this file${when}, after you opened it.\n\nSaving now will overwrite their changes. Cancel, then reopen the file to get their version (your edits stay as a draft on this computer).\n\nOverwrite anyway?`)) return;
      }
      const w = await fileHandle.createWritable();
      await w.write(html);
      await w.close();
      afterSave(next, 'Saved to ' + fileHandle.name);
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      fileHandle = null;
      alert('Could not save directly (' + (e && e.message ? e.message : e) + ').\nA copy will be downloaded instead — use it to replace the file on the shared drive.');
    }

    alert(`This browser can't write to the file directly, so an updated copy will be downloaded.\n\nMove it to the shared drive and replace "${fileName()}" with it.\n(Chrome or Edge on a computer can save straight to the file.)`);
  }
  download(html, fileName());
  afterSave(next, 'Downloaded updated copy — replace the file on the shared drive');
}

/* ---------------------------------------------------------------- shell */
const TABS = [['dashboard', 'Dashboard'], ['activities', 'Activities'], ['students', 'Students'], ['deployments', 'Deployments'], ['settings', 'Settings & Help']];

function render() {

function recordForm(fields, record, onSubmit, onCancel, submitLabel) {
  const inputs = {};
  const grid = el('div', { class: 'form-grid' });
  for (const [key, label, type, cls] of fields) {
    let control;
    if (type === 'category') control = selectEl(data.lists.categories, record[key] || '', () => {}, '—');
    else if (type === 'group') control = selectEl(data.lists.groups, record[key] || '', () => {}, '—');
    else if (type === 'formClass') control = selectEl(formClassOptions(), record[key] || '', () => {}, '—');
    else if (type === 'ccas') {
      const chosen = new Set(record[key] || []);
      const boxes = ccaOptions().map(c => el('label', { class: 'check' }, [el('input', { type: 'checkbox', value: c, checked: chosen.has(c) }), c]));
      control = el('div', { class: 'cca-picks' }, boxes.length ? boxes : el('span', { class: 'muted', text: 'Add CCAs under Settings › Dropdown lists.' }));
      control.getValue = () => [...control.querySelectorAll('input:checked')].map(b => b.value);
    } else control = el('input', { type, value: record[key] ?? '', min: type === 'number' ? '0' : null, step: type === 'number' ? '1' : null });
    inputs[key] = control;
    grid.append(field(label, control, cls));
  }
  const err = el('div', { class: 'muted', style: 'color:var(--danger-ink);margin-top:8px' });
  const form = el('form', {
    onsubmit: e => {
      e.preventDefault();
      const values = Object.fromEntries(Object.entries(inputs).map(([k, c]) => [k, c.getValue ? c.getValue() : c.value.trim()]));
      const problem = onSubmit(values);
      if (problem) err.textContent = problem;

    el('button', { class: 'btn primary', type: 'submit' }, submitLabel),
    onCancel ? el('button', { class: 'btn', type: 'button', onclick: onCancel }, 'Cancel') : null,
  ])]);
  setTimeout(() => inputs[fields[0][0]].focus?.(), 0);
  return form;
}

function csvCell(v) { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function saveCsv(name, rows) {
  const text = '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));
  const a = el('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function exportCsv(kind) {

  wrap.append(el('section', { class: 'panel' }, [
    el('h2', { text: 'Import students' }),
    el('p', { class: 'sub', text: 'Copy columns from Excel or Google Sheets in this order — Full name, Preferred name, Form class, Leadership group, CCAs — and paste below. Separate several CCAs with “;” or “/”. A header row is skipped automatically; names already on the list are skipped.' }),
    paste,
    el('div', { class: 'form-actions' }, el('button', { class: 'btn primary', onclick: () => {
      let added = 0, skipped = 0;
      for (const r of parseRows(paste.value)) {
        if (/^full\s*name$/i.test(r[0] || '')) continue;
        const res = r[0] && r[2] ? saveStudent(null, { fullName: r[0], name: r[1] || '', formClass: r[2], group: r[3] || '', ccas: (r[4] || '').split(/[;/]/).map(x => x.trim()).filter(Boolean), notes: '' }) : 'invalid';
        if (typeof res === 'string') skipped++; else added++;
      }
      paste.value = '';
      commit(`Imported ${added} student${added === 1 ? '' : 's'}${skipped ? `, skipped ${skipped}` : ''}`);
    } }, 'Import')),
  ]));

  const fileIn = el('input', { type: 'file', accept: '.json,application/json', style: 'display:none', onchange: async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const incoming = normalize(JSON.parse(await file.text()));
      if (!confirm(`Replace ALL current data with this backup (${incoming.students.length} students, ${incoming.activities.length} activities, ${incoming.deployments.length} deployments)?`)) return;
      data = { ...incoming, revision: data.revision, savedAt: data.savedAt, savedBy: data.savedBy };
      commit('Backup loaded — click Save to keep it');
    } catch (err) { alert('That file is not a valid backup: ' + err.message); }
  } });
  wrap.append(el('section', { class: 'panel' }, [
    el('h2', { text: 'Export & housekeeping' }),
    el('p', { class: 'sub', text: 'CSV files open in Excel or Google Sheets. A backup (.json) can be loaded back into any copy of this dashboard.' }),
    el('div', { class: 'form-actions' }, [
      el('button', { class: 'btn', onclick: () => exportCsv('deployments') }, 'Deployments CSV'),
      el('button', { class: 'btn', onclick: () => exportCsv('activities') }, 'Activities CSV'),
      el('button', { class: 'btn', onclick: () => exportCsv('students') }, 'Students CSV'),
      el('button', { class: 'btn', onclick: () => { const u = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })); const a = el('a', { href: u, download: 'student-leader-deployment-backup.json' }); document.body.append(a); a.click(); a.remove(); } }, 'Download backup'),
      el('button', { class: 'btn', onclick: () => fileIn.click() }, 'Load backup…'), fileIn,
    ]),
    el('div', { class: 'form-actions' }, [
      el('button', { class: 'btn danger', onclick: () => {
        if (!confirm('Start a new year? This deletes all activities and deployments but keeps students, lists and settings.\n\nTip: first download a backup, or keep a copy of the file.')) return;
        data.activities = []; data.deployments = []; commit('Activities and deployments cleared — click Save to keep');
      } }, 'New year: clear activities & deployments'),
      el('button', { class: 'btn danger', onclick: () => {
        if (!confirm('Delete ALL students, activities and deployments? Lists and settings are kept.')) return;
        data.students = []; data.activities = []; data.deployments = []; commit('All records cleared — click Save to keep');
      } }, 'Clear all records'),
    ]),
  ]));

  wrap.append(el('section', { class: 'panel help' }, [
    el('h2', { text: 'How this file works' }),
    el('p', {}, 'Everything — the dashboard and all its data — is inside this one .html file. There is nothing to install and no internet connection is needed.'),
    el('h3', { text: 'Opening it' }),
    el('ul', {}, [
      el('li', {}, 'Open the file from the shared drive in File Explorer / Finder (a mapped drive, OneDrive or Google Drive for desktop). It opens in your web browser.'),
      el('li', {}, 'The Google Drive or SharePoint website will only show it as code — download it or use the synced folder instead.'),
    ]),
    el('h3', { text: 'Saving changes' }),
    el('ol', {}, [
      el('li', {}, 'Make your changes, then click Save (top right).'),
      el('li', {}, 'In Chrome or Edge on a computer, the first Save asks where to save — pick this same file on the shared drive and confirm Replace. Later saves in the same session go straight to the file.'),
      el('li', {}, 'In other browsers (Safari, Firefox, phones) Save downloads an updated copy; move it to the shared drive and replace the old file.'),
      el('li', {}, 'Unsaved changes are kept on your computer as a draft, so closing the tab by accident is recoverable.'),
    ]),
    el('h3', { text: 'Sharing with colleagues' }),
    el('ul', {}, [
      el('li', {}, 'Several people can view at once. When editing, the last save wins — Chrome/Edge will warn you if someone saved after you opened the file.'),
      el('li', {}, 'Agree on one or two people per week who update deployments, or reopen the file before making changes.'),
      el('li', {}, 'Each save records the editor’s name and time (shown at the top).'),
    ]),
    el('h3', { text: 'Counting rules' }),
    el('ul', {}, [
      el('li', {}, 'Confirmed, Tentative and Completed deployments all count. Withdrawn ones are kept for the record but excluded from every count and from hours.'),
      el('li', {}, 'Leader-hours use the activity’s start/end time unless an hours override is entered for that leader.'),
      el('li', {}, `A leader is “High load” at ${st.highLoad} or more deployments (change this above). The dashboard’s date filter counts only activities in that range — useful for a single term.`),
    ]),
  ]));
  return wrap;
}

/* ---------------------------------------------------------------- start */
pendingDraft = loadDraft();
render();
</script>
</body>
</html>
