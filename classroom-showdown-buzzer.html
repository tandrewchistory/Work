<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buzzer</title>
<style>
:root{
  --wall:#efeade; --paper:#fffdf7; --ink:#2a2b21; --ink-soft:#6b6b5d;
  --paper-edge:#e2ddc9; --accent:#d9720f; --accent-ink:#fff8ec; --accent-soft:#f6ddc0;
  --good:#2f8f46; --good-soft:#dcf0e0; --danger:#c8402f; --danger-soft:#f6dbd6;
  --info:#2f66d0; --info-soft:#dbe6fa; --focus:#2f66d0;
}
@media (prefers-color-scheme: dark){
  :root{
    --wall:#181910; --paper:#232419; --ink:#f2efe1; --ink-soft:#a9a894;
    --paper-edge:#3a3b2c; --accent:#f0b93e; --accent-ink:#241a08; --accent-soft:#4a3c1a;
    --good:#8fe0a0; --good-soft:#1f3a26; --danger:#ff9e88; --danger-soft:#3f241d;
    --info:#86b3ff; --info-soft:#1f2c47; --focus:#86b3ff;
  }
}
*{ box-sizing:border-box; }
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--wall);
  color:var(--ink);
  font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding:20px;
}
#card{
  background:var(--paper);
  border:1px solid var(--paper-edge);
  border-radius:16px;
  width:min(420px, 100%);
  padding:28px 26px 24px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.25);
}
h1{ font-size:22px; margin:0 0 4px; }
#room-label{ color:var(--ink-soft); font-size:13px; margin:0 0 20px; text-transform:uppercase; letter-spacing:0.6px; font-weight:700; }
.field{ display:flex; flex-direction:column; gap:5px; text-align:left; margin-bottom:12px; }
.field span{ font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-soft); }
.field input, .field textarea{
  background:var(--wall);
  border:1px solid var(--paper-edge);
  border-radius:6px;
  padding:8px 10px;
  color:var(--ink);
  font-size:14px;
}
.field textarea{ font-family:ui-monospace, monospace; font-size:12px; }
.btn{
  background:var(--paper);
  color:var(--ink);
  border:1.5px solid var(--ink);
  padding:10px 20px;
  border-radius:8px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  width:100%;
}
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn:disabled{ opacity:0.4; cursor:not-allowed; }
#status{ font-size:13px; color:var(--ink-soft); margin:12px 0; min-height:1.2em; }
#status.error{ color:var(--danger); font-weight:700; }
#you{ font-size:13px; color:var(--ink-soft); margin:0 0 16px; }
#buzz-btn{
  width:180px;
  height:180px;
  border-radius:50%;
  margin:10px auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  font-weight:800;
  letter-spacing:1px;
  background:var(--accent);
  color:var(--accent-ink);
  border:none;
  cursor:pointer;
  box-shadow:0 10px 0 rgba(0,0,0,0.2);
}
#buzz-btn:active:not(:disabled){ transform:translateY(6px); box-shadow:0 4px 0 rgba(0,0,0,0.2); }
#buzz-btn:disabled{ background:var(--paper-edge); color:var(--ink-soft); cursor:not-allowed; box-shadow:none; }
#buzz-btn.armed{ animation:pulse 1.1s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ box-shadow:0 10px 0 rgba(0,0,0,0.2), 0 0 0 0 var(--accent-soft); } 50%{ box-shadow:0 10px 0 rgba(0,0,0,0.2), 0 0 0 14px transparent; } }
#result{ min-height:1.4em; font-weight:700; font-size:15px; }
#result.mine{ color:var(--good); }
#result.other{ color:var(--ink-soft); }
#sign-in-btn{ display:flex; align-items:center; justify-content:center; gap:8px; }
.hidden{ display:none !important; }
</style>
</head>
<body>
<div id="card">
  <h1>🔔 Buzzer</h1>
  <p id="room-label">Room —</p>

  <div id="setup-form">
    <p style="color:var(--ink-soft); font-size:13px;">This link is missing its setup details. Paste them below, or ask your teacher for a fresh link.</p>
    <label class="field">
      <span>Room Code</span>
      <input type="text" id="manual-room-input" maxlength="8">
    </label>
    <label class="field">
      <span>Firebase Config</span>
      <textarea id="manual-config-input" rows="5" placeholder='{ "apiKey": "...", "authDomain": "...", "databaseURL": "...", "projectId": "...", "appId": "..." }'></textarea>
    </label>
    <button class="btn primary" id="manual-continue-btn" type="button">Continue</button>
  </div>

  <div id="signin-view" class="hidden">
    <button class="btn primary" id="sign-in-btn" type="button">Sign in with Google</button>
  </div>

  <div id="buzz-view" class="hidden">
    <p id="you"></p>
    <button id="buzz-btn" type="button" disabled>WAIT</button>
    <p id="result"></p>
  </div>

  <p id="status"></p>
</div>

<script>
(function(){
  "use strict";

  var FIREBASE_APP_URL = window.__TEST_FIREBASE_APP_URL__ || "https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js";
  var FIREBASE_AUTH_URL = window.__TEST_FIREBASE_AUTH_URL__ || "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js";
  var FIREBASE_DATABASE_URL = window.__TEST_FIREBASE_DATABASE_URL__ || "https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js";

  var roomLabel = document.getElementById("room-label");
  var setupForm = document.getElementById("setup-form");
  var manualRoomInput = document.getElementById("manual-room-input");
  var manualConfigInput = document.getElementById("manual-config-input");
  var manualContinueBtn = document.getElementById("manual-continue-btn");
  var signinView = document.getElementById("signin-view");
  var signInBtn = document.getElementById("sign-in-btn");
  var buzzView = document.getElementById("buzz-view");
  var youEl = document.getElementById("you");
  var buzzBtn = document.getElementById("buzz-btn");
  var resultEl = document.getElementById("result");
  var statusEl = document.getElementById("status");

  var room = "";
  var hostedDomain = "";
  var firebaseConfig = null;
  var db = null;
  var user = null;
  var armed = false;
  var roundHandler = null;
  var lockHandler = null;

  function setStatus(text, isError){
    statusEl.textContent = text || "";
    statusEl.className = isError ? "error" : "";
  }

  function parseFirebaseConfig(text){
    var trimmed = (text || "").trim();
    if (!trimmed) return null;
    var body = trimmed.replace(/^\s*(const|var|let)\s+\w+\s*=\s*/, "").replace(/;\s*$/, "");
    var jsonish = body.replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, "$1\"$2\":").replace(/'/g, "\"");
    try {
      var parsed = JSON.parse(jsonish);
      if (parsed && typeof parsed.apiKey === "string" && typeof parsed.databaseURL === "string") return parsed;
      return null;
    } catch (err) {
      return null;
    }
  }

  function readFromHash(){
    var hash = (location.hash || "").replace(/^#/, "");
    var params = {};
    hash.split("&").forEach(function(part){
      if (!part) return;
      var eq = part.indexOf("=");
      if (eq === -1) return;
      params[decodeURIComponent(part.slice(0, eq))] = decodeURIComponent(part.slice(eq + 1));
    });
    room = (params.room || "").toUpperCase();
    hostedDomain = params.hd || "";
    if (params.cfg){
      try { firebaseConfig = JSON.parse(atob(params.cfg)); } catch (err) { firebaseConfig = null; }
    }
  }

  var loadedScriptUrls = {};
  function loadScript(url){
    if (!loadedScriptUrls[url]){
      loadedScriptUrls[url] = new Promise(function(resolve, reject){
        var el = document.createElement("script");
        el.src = url;
        var timer = setTimeout(function(){ reject(new Error("Timed out loading " + url)); }, 15000);
        el.onload = function(){ clearTimeout(timer); resolve(); };
        el.onerror = function(){ clearTimeout(timer); reject(new Error("Couldn't load the Firebase library — check your internet connection.")); };
        document.head.appendChild(el);
      });
    }
    return loadedScriptUrls[url];
  }

  function beginSetup(){
    if (!room || !firebaseConfig){
      setupForm.classList.remove("hidden");
      return;
    }
    roomLabel.textContent = "Room " + room;
    setupForm.classList.add("hidden");
    setStatus("Loading…");

    loadScript(FIREBASE_APP_URL)
      .then(function(){ return Promise.all([loadScript(FIREBASE_AUTH_URL), loadScript(FIREBASE_DATABASE_URL)]); })
      .then(function(){
        var fb = window.firebase;
        var app = (fb.apps && fb.apps.length) ? fb.app() : fb.initializeApp(firebaseConfig);
        db = app.database();
        setStatus("");
        signinView.classList.remove("hidden");
      })
      .catch(function(err){
        setStatus((err && err.message) ? err.message : "Couldn't connect.", true);
      });
  }

  function signIn(){
    setStatus("Signing in…");
    var provider = new window.firebase.auth.GoogleAuthProvider();
    if (hostedDomain) provider.setCustomParameters({ hd: hostedDomain });
    window.firebase.auth().signInWithPopup(provider).then(function(result){
      user = result.user;
      youEl.textContent = "Signed in as " + (user.displayName || user.email || "you");
      signinView.classList.add("hidden");
      buzzView.classList.remove("hidden");
      setStatus("");
      listenForRound();
    }).catch(function(err){
      setStatus((err && err.message) ? err.message : "Sign-in failed — try again.", true);
    });
  }

  function listenForRound(){
    var roundRef = db.ref("rooms/" + room + "/round");
    var lockRef = db.ref("rooms/" + room + "/lock");
    var lastRound = null;
    roundHandler = function(snapshot){
      var val = snapshot.val();
      if (val === lastRound) return;
      lastRound = val;
      armed = !!val;
      resultEl.textContent = "";
      resultEl.className = "";
      buzzBtn.textContent = armed ? "BUZZ" : "WAIT";
      buzzBtn.classList.toggle("armed", armed);
      buzzBtn.disabled = !armed;
    };
    lockHandler = function(snapshot){
      var val = snapshot.val();
      if (!val){
        if (armed) buzzBtn.disabled = false;
        return;
      }
      buzzBtn.disabled = true;
      buzzBtn.classList.remove("armed");
      if (user && val.uid === user.uid){
        resultEl.textContent = "You buzzed in first!";
        resultEl.className = "mine";
      } else {
        resultEl.textContent = (val.name || "Someone") + " buzzed in first.";
        resultEl.className = "other";
      }
    };
    roundRef.on("value", roundHandler);
    lockRef.on("value", lockHandler);
  }

  function pressBuzz(){
    if (!armed || !db || !user) return;
    buzzBtn.disabled = true;
    var lockRef = db.ref("rooms/" + room + "/lock");
    lockRef.transaction(function(current){
      if (current === null || current === undefined){
        return { uid: user.uid, name: user.displayName || user.email || "Student", ts: window.firebase.database.ServerValue.TIMESTAMP };
      }
      return undefined;
    }).catch(function(){ buzzBtn.disabled = !armed; });
  }

  manualContinueBtn.addEventListener("click", function(){
    var manualRoom = (manualRoomInput.value || "").trim().toUpperCase();
    var manualConfig = parseFirebaseConfig(manualConfigInput.value);
    if (!manualRoom){ setStatus("Enter a room code.", true); return; }
    if (!manualConfig){ setStatus("That config couldn't be read.", true); return; }
    room = manualRoom;
    firebaseConfig = manualConfig;
    beginSetup();
  });
  signInBtn.addEventListener("click", signIn);
  buzzBtn.addEventListener("click", pressBuzz);

  readFromHash();
  beginSetup();
})();
</script>
</body>
</html>
